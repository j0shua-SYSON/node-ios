name: build

# Cross-compile Node.js for jailbroken iOS 15 arm64 (Dopamine / rootless, iphoneos-arm64).
# The whole iOS-specific patch set lives in scripts/ios-source-fixups.sh.

on:
  workflow_dispatch:
    inputs:
      node_ref:
        description: "Node.js git tag to build (e.g. v22.19.0)"
        default: "v22.19.0"
      package_revision:
        description: "Debian revision for the iOS nodejs package"
        default: "2"
      release_tag:
        description: "Optional GitHub release tag for the verified binary and package"
        required: false
  push:
    paths:
      - ".github/workflows/build.yml"
      - "scripts/ios-source-fixups.sh"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14 # arm64 host == arm64 target; different OS/sysroot
    timeout-minutes: 120
    env:
      NODE_REF: ${{ github.event.inputs.node_ref || 'v22.19.0' }}
      PACKAGE_REVISION: ${{ github.event.inputs.package_revision || '2' }}
      RELEASE_TAG: ${{ github.event.inputs.release_tag || '' }}
      IOS_MIN: "15.0"
    steps:
      - uses: actions/checkout@v4

      - name: Pin Python 3.12 (Node's configure rejects 3.14)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Toolchain + SDK
        run: |
          set -euxo pipefail
          echo "iphoneos SDK: $(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos --show-sdk-version
          brew list ldid  >/dev/null 2>&1 || brew install ldid
          brew list ccache >/dev/null 2>&1 || brew install ccache
          brew list dpkg   >/dev/null 2>&1 || brew install dpkg

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ env.NODE_REF }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.NODE_REF }}-
            ccache-

      - name: Clone Node ${{ env.NODE_REF }}
        run: git clone --depth 1 --branch "$NODE_REF" https://github.com/nodejs/node.git node-src

      - name: iOS source fixups
        run: bash scripts/ios-source-fixups.sh node-src

      - name: Configure (iphoneos-arm64, min iOS ${{ env.IOS_MIN }})
        working-directory: node-src
        run: |
          set -euxo pipefail
          export IPHONEOS_DEPLOYMENT_TARGET="$IOS_MIN"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          export CCACHE_DIR="$HOME/.ccache" CCACHE_MAXSIZE=3G
          export CC="ccache clang -arch arm64 -isysroot $SDK -miphoneos-version-min=$IOS_MIN"
          export CXX="ccache clang++ -std=gnu++20 -arch arm64 -isysroot $SDK -miphoneos-version-min=$IOS_MIN"
          export CC_host="ccache clang"
          export CXX_host="ccache clang++ -std=gnu++20"
          export LDFLAGS="-arch arm64 -isysroot $SDK -miphoneos-version-min=$IOS_MIN"
          export GYP_DEFINES="target_arch=arm64 host_arch=arm64 host_os=mac target_os=ios"
          python3 configure \
            --dest-os=ios --dest-cpu=arm64 --cross-compiling \
            --with-intl=small-icu --without-npm \
            --without-node-snapshot --without-node-code-cache --without-inspector \
            --openssl-no-asm

      - name: Build
        working-directory: node-src
        run: |
          set -uxo pipefail
          export CCACHE_DIR="$HOME/.ccache"
          set +e
          # -j2 (not logicalcpu=3): the V8 W^X JIT patch flips a macro in build_config.h,
          # which is included across ALL of V8, so every V8 TU is a cold ccache miss. Three
          # concurrent cold -O3 V8 compiles OOM-kill the 3-core/7GB macOS runner (silent
          # SIGKILL, no clang error). -j2 keeps peak memory under the ceiling.
          make -j2 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          echo "make rc=$rc"
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "=== errors ==="
            grep -nE "error:|fatal error|Error [0-9]|ld: |Undefined symbols|clang: error" build.log \
              | grep -viE "no newline|Wnewline-eof|#warning|_GLIBCXX" | tail -60
            exit 1
          fi
          ls -la out/Release/node

      - name: Verify + sign
        working-directory: node-src
        run: |
          set -euxo pipefail
          file out/Release/node
          otool -l out/Release/node | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN_IPHONEOS" || true
          plutil -lint ../entitlements.plist
          ldid -S../entitlements.plist out/Release/node
          echo "size: $(du -h out/Release/node | cut -f1)"

      - name: Package runtime for Sileo
        run: |
          set -euxo pipefail
          version="${NODE_REF#v}"
          package_version="${version}-${PACKAGE_REVISION}"
          root="$RUNNER_TEMP/nodejs-pkg"
          mkdir -p "$root/DEBIAN" "$root/usr/bin" "$root/usr/lib/nodejs" \
            "$root/usr/lib/node_modules" "$root/usr/share/doc/nodejs" "$RUNNER_TEMP/dist"
          cp node-src/out/Release/node "$root/usr/lib/nodejs/node"
          cp -R node-src/deps/npm "$root/usr/lib/node_modules/npm"
          cp node-src/LICENSE "$root/usr/share/doc/nodejs/copyright"
          cp README.md "$root/usr/share/doc/nodejs/README.port"
          cat > "$root/usr/bin/node" <<'EOF'
          #!/var/jb/bin/sh
          exec /var/jb/usr/lib/nodejs/node --predictable --single-threaded --disable-wasm-trap-handler "$@"
          EOF
          cat > "$root/usr/bin/npm" <<'EOF'
          #!/var/jb/bin/sh
          exec /var/jb/usr/lib/nodejs/node --predictable --single-threaded --disable-wasm-trap-handler /var/jb/usr/lib/node_modules/npm/bin/npm-cli.js "$@"
          EOF
          cat > "$root/usr/bin/npx" <<'EOF'
          #!/var/jb/bin/sh
          exec /var/jb/usr/lib/nodejs/node --predictable --single-threaded --disable-wasm-trap-handler /var/jb/usr/lib/node_modules/npm/bin/npx-cli.js "$@"
          EOF
          chmod 755 "$root/usr/bin/node" "$root/usr/bin/npm" "$root/usr/bin/npx" "$root/usr/lib/nodejs/node"
          cat > "$root/DEBIAN/control" <<EOF
          Package: nodejs
          Version: ${package_version}
          Architecture: iphoneos-arm64
          Maintainer: Alsinas Labs
          Section: Development
          Priority: optional
          Depends: firmware (>= 15.0)
          Description: Node.js ${version} runtime for jailbroken iOS arm64
           Experimental upstream Node.js port with W^X JIT support for iOS.
           Ships JavaScript JIT and WebAssembly with iOS-safe target features.
          EOF
          dpkg-deb --build --root-owner-group "$root" \
            "$RUNNER_TEMP/dist/nodejs_${package_version}_iphoneos-arm64.deb"
          dpkg-deb --field "$RUNNER_TEMP/dist/nodejs_${package_version}_iphoneos-arm64.deb" Package Version Architecture Depends
          cp node-src/out/Release/node "$RUNNER_TEMP/dist/node-${version}-iphoneos-arm64"
          cp entitlements.plist "$RUNNER_TEMP/dist/entitlements.plist"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: node-ios-${{ env.NODE_REF }}-r${{ env.PACKAGE_REVISION }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish release assets
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          if ! gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Node $NODE_REF for iOS arm64 (runtime revision $PACKAGE_REVISION)" \
              --notes "Node.js for rootless jailbroken iOS arm64. This build avoids optional ARM features from the macOS build host in the iOS V8 snapshot, preserving JIT and WebAssembly on older supported devices. The Sileo package is nodejs ${NODE_REF#v}-${PACKAGE_REVISION}."
          fi
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/dist/"* --clobber -R "$GITHUB_REPOSITORY"
